// ===== FULLSCREEN TIMER =====
// One timer at a time, readable from across the mat. Holds get a lead-in to get into position,
// a signal at the target time and another one when the previous best falls.
const DIAL_C = 791.68; // circumference of the r=126 dial
const LEAD_STEPS = [0, 3, 5, 10];
let timer = null;
let audioCtx = null;
let wakeLock = null;

function fmtTimer(ms) {
  const totalSec = ms / 1000;
  const m = Math.floor(totalSec / 60);
  const s = Math.floor(totalSec % 60);
  const cs = Math.floor((ms % 1000) / 10);
  return `${m}:${s.toString().padStart(2, '0')}.${cs.toString().padStart(2, '0')}`;
}

// "3x45s" → 45, "4x10-15s" → 15, "2-3 min" → 180, "3x max" → null
function parseGoalSeconds(target) {
  const m = String(target || '').toLowerCase().match(/(\d+)(?:\s*-\s*(\d+))?\s*(sek|sec|min|s)\b/);
  if (!m) return null;
  const n = parseInt(m[2] || m[1]);
  return m[3] === 'min' ? n * 60 : n;
}

function beep(freq, dur, delay = 0) {
  if (!settings.sound || !audioCtx) return;
  try {
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.4, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  } catch (e) {}
}
function buzz(pattern) {
  try { navigator.vibrate?.(pattern); } catch (e) {}
}

function openTimer(exIdx, setIdx) {
  const ex = trainExs[exIdx];
  if (!ex || timer) return;
  const isHold = ex.type === 'hold' || ex.type === 'whold';
  let best = null;
  if (ex.type === 'hold') {
    best = trainBests[exIdx]?.a ?? null;
  } else if (ex.type === 'whold') {
    // The best time is only a mark to chase when this set carries the same weight
    const rec = trainBests[exIdx];
    const kg = parseFloat(document.querySelector(`[data-ex="${exIdx}"][data-set="${setIdx}"][data-field="weight"]`)?.value) || 0;
    if (rec && rec.a === kg) best = rec.b;
  }
  const parsed = parseGoalSeconds(ex.target);
  timer = {
    exIdx, setIdx, isHold, best,
    goal: parsed ?? best,           // no time in the target ("3x max") → chase the previous best
    goalHit: parsed === null,       // then the best-signal alone marks the moment
    bestHit: false,
    phase: isHold && settings.lead > 0 ? 'lead' : 'run',
    t0: Date.now(),
    lastLead: null,
    raf: 0
  };

  const facts = [];
  if (parsed !== null) facts.push(`<div><span>Ziel</span><b>${num(parsed)} s</b></div>`);
  if (best !== null) facts.push(`<div><span>Bestwert</span><b>${num(best)} s</b></div>`);

  $('#timer-root').innerHTML = `
    <div class="timer-overlay ${timer.phase}" id="timer-overlay" role="dialog" aria-label="Timer">
      <div class="timer-top">
        <div>
          <div class="timer-ex">${ex.name}</div>
          <div class="timer-set">Satz ${setIdx + 1} von ${ex.sets}</div>
        </div>
        <button class="timer-close" id="timer-cancel" aria-label="Timer verwerfen">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="timer-dial">
        <svg viewBox="0 0 280 280" aria-hidden="true">
          <circle class="dial-track" cx="140" cy="140" r="126"/>
          <circle class="dial-fill" id="dial-fill" cx="140" cy="140" r="126" stroke-dasharray="${DIAL_C}" stroke-dashoffset="${DIAL_C}"/>
        </svg>
        <div class="timer-read">
          <div class="timer-main" id="timer-main">0:00</div>
          <div class="timer-cs" id="timer-cs"></div>
        </div>
      </div>
      <div class="timer-status" id="timer-status"></div>
      <div class="timer-facts">${facts.join('')}</div>
      <div class="timer-opts">
        ${isHold ? `<button class="timer-opt" id="timer-lead"></button>` : ''}
        <button class="timer-opt" id="timer-sound"></button>
      </div>
      <button class="timer-stop" id="timer-stop"></button>
    </div>`;
  paintTimerOptions();

  // Audio has to be unlocked inside the tap that opened the timer
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
  // Keep the screen on while the clock runs
  try { navigator.wakeLock?.request('screen').then(l => { wakeLock = l; if (!timer) l.release(); }).catch(() => {}); } catch (e) {}

  tickTimer();
}

function paintTimerOptions() {
  const lead = $('#timer-lead'), sound = $('#timer-sound'), stop = $('#timer-stop');
  if (lead) lead.textContent = settings.lead ? `Vorlauf ${settings.lead} s` : 'Kein Vorlauf';
  if (sound) sound.textContent = settings.sound ? 'Ton an' : 'Ton aus';
  if (stop && timer) stop.textContent = timer.phase === 'lead' ? 'Abbrechen' : 'Stopp';
}

function cycleLead() {
  settings.lead = LEAD_STEPS[(LEAD_STEPS.indexOf(settings.lead) + 1) % LEAD_STEPS.length];
  saveSettings();
  // Changing it during the lead-in restarts the lead-in with the new length
  if (timer && timer.phase === 'lead') {
    timer.t0 = Date.now();
    timer.lastLead = null;
    if (!settings.lead) startRun();
  }
  paintTimerOptions();
}

function toggleSound() {
  settings.sound = !settings.sound;
  saveSettings();
  paintTimerOptions();
}

function startRun() {
  timer.phase = 'run';
  timer.t0 = Date.now();
  $('#timer-overlay')?.classList.remove('lead');
  $('#timer-status').textContent = '';
  beep(1320, 0.3);
  buzz(90);
  paintTimerOptions();
}

function tickTimer() {
  if (!timer) return;
  const overlay = $('#timer-overlay'), main = $('#timer-main'), cs = $('#timer-cs'), fill = $('#dial-fill'), status = $('#timer-status');
  if (!overlay) { timer = null; return; }
  const now = Date.now();

  if (timer.phase === 'lead') {
    const left = settings.lead * 1000 - (now - timer.t0);
    if (left <= 0) {
      startRun();
    } else {
      const sec = Math.ceil(left / 1000);
      if (sec !== timer.lastLead) {
        timer.lastLead = sec;
        main.textContent = sec;
        cs.textContent = '';
        status.textContent = 'In Position gehen';
        if (sec <= 3) beep(660, 0.1);
      }
      fill.style.strokeDashoffset = DIAL_C * (1 - left / (settings.lead * 1000));
    }
  }

  if (timer.phase === 'run') {
    const ms = Date.now() - timer.t0;
    const sec = ms / 1000;
    main.textContent = `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
    cs.textContent = '.' + String(Math.floor((ms % 1000) / 10)).padStart(2, '0');
    // Dial fills towards the goal; without a goal it sweeps once per minute
    const frac = timer.goal ? Math.min(1, sec / timer.goal) : (sec % 60) / 60;
    fill.style.strokeDashoffset = DIAL_C * (1 - frac);

    if (!timer.goalHit && timer.goal && sec >= timer.goal) {
      timer.goalHit = true;
      status.textContent = 'Ziel erreicht';
      beep(990, 0.14);
      beep(990, 0.14, 0.2);
      buzz([120, 70, 120]);
    }
    if (!timer.bestHit && timer.best !== null && sec > timer.best) {
      timer.bestHit = true;
      overlay.classList.add('best');
      status.textContent = 'Neuer Bestwert';
      beep(990, 0.12);
      beep(1320, 0.12, 0.16);
      beep(1760, 0.24, 0.32);
      buzz([80, 50, 80, 50, 200]);
    }
  }

  timer.raf = requestAnimationFrame(tickTimer);
}

// commit = take the time over into the set; a stop during the lead-in never counts
function stopTimer(commit) {
  if (!timer) return;
  cancelAnimationFrame(timer.raf);
  const { exIdx, setIdx, phase, t0 } = timer;
  timer = null;
  try { wakeLock?.release(); } catch (e) {}
  wakeLock = null;
  $('#timer-root').innerHTML = '';

  if (!commit || phase !== 'run') return;
  const ms = Date.now() - t0;
  const btn = document.querySelector(`[data-timer-ex="${exIdx}"][data-timer-set="${setIdx}"]`);
  const input = document.querySelector(`[data-ex="${exIdx}"][data-set="${setIdx}"][data-field="seconds"]`);
  if (btn) {
    // The icon-only button next to a seconds field keeps its icon, the time is in the field
    if (!btn.classList.contains('compact')) btn.textContent = fmtTimer(ms);
    btn.classList.add('timed');
  }
  if (input) {
    input.value = Math.round(ms / 10) / 100;
    input.dispatchEvent(new Event('input', { bubbles: true }));
  }
}

// The app can stay open in the background over midnight. On return it moves on to the new day,
// unless a timer runs or the day on screen has unsaved input (a workout in progress keeps its date).
let lastToday = today();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const now = today();
  if (now === lastToday) return;
  const idle = state.trainingDate === lastToday && !timer && !Object.keys(drafts[draftKey()] || {}).length;
  lastToday = now;
  if (idle) setTrainingDate(now);
});

// The lock is dropped when the app goes to the background; take it again on return
document.addEventListener('visibilitychange', () => {
  if (timer && document.visibilityState === 'visible') {
    try { navigator.wakeLock?.request('screen').then(l => { wakeLock = l; if (!timer) l.release(); }).catch(() => {}); } catch (e) {}
  }
});

// ===== SERVICE WORKER REGISTRATION =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'activated') {
          toast('App aktualisiert!');
        }
      });
    });
  });
}
</script>
</body>
